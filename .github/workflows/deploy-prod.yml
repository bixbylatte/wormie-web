name: Deploy Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: wormie-web-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate required variables
        shell: bash
        run: |
          set -euo pipefail
          required_vars=(
            PROJECT_ID REGION REPOSITORY SERVICE_NAME
            WIF_PROVIDER DEPLOYER_SERVICE_ACCOUNT RUNTIME_SERVICE_ACCOUNT
            API_BASE_URL
          )
          for key in "${required_vars[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required GitHub Actions variable: ${key}" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Write Cloud Run env file
        shell: bash
        run: |
          printf 'API_BASE_URL: "%s"\n' "${API_BASE_URL}" > cloud-run-env.yaml

      - name: Deploy web service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --min-instances 0 \
            --execution-environment gen2 \
            --allow-unauthenticated \
            --env-vars-file cloud-run-env.yaml

      - name: Verify health
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')"
          curl --fail --silent --show-error "${SERVICE_URL}/health" >/dev/null
          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Wormie Web production deployment"
            echo ""
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- Service URL: ${SERVICE_URL}"
            echo "- Runtime API base URL: ${API_BASE_URL}"
            echo "- Health check: \`${SERVICE_URL}/health\` passed"
          } >> "$GITHUB_STEP_SUMMARY"
